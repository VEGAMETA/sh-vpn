# Ansible ignores ansible.cfg in a world-writable cwd (/mnt/h under WSL): run through ./ansible.sh.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
vault_password_file = ~/.config/vpn/vault_pass
interpreter_python = /usr/bin/python3
stdout_callback = default
result_format = yaml
retry_files_enabled = false

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
