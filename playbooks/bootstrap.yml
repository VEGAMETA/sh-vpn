# Fresh VPS only, as root (key in root's authorized_keys):
#   ./ansible.sh playbooks/bootstrap.yml -l nl-exit -e ansible_user=root -e ansible_ssh_private_key_file=~/.ssh/id_ed25519
# Admin user `vegameta` (sudo with the vault password), `deploy` (key-only, NOPASSWD sudo
# for Ansible), SSH hardening, root password locked. ru-entry is bootstrapped by botato.
- name: Bootstrap a fresh server
  hosts: nl
  gather_facts: false
  vars:
    admin_user: vegameta
    deploy_user: deploy
    admin_pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"
    deploy_pubkey: "{{ lookup('file', '~/.ssh/deploy_ed25519.pub') }}"

  tasks:
    - name: Hash the admin password locally (no passlib needed)
      delegate_to: localhost
      ansible.builtin.command: openssl passwd -6 -stdin
      args:
        stdin: "{{ vault_nl_admin_password }}"
      register: admin_hash
      changed_when: false
      no_log: true

    - name: Install sudo
      ansible.builtin.apt:
        name: sudo
        update_cache: true

    - name: Users
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: /bin/bash
        groups: "{{ item.groups }}"
        append: true
        password: "{{ item.password }}"
        update_password: on_create
      loop:
        - { name: "{{ admin_user }}", groups: [sudo], password: "{{ admin_hash.stdout }}" }
        - { name: "{{ deploy_user }}", groups: [], password: "!" }
      no_log: true

    - name: Authorized keys
      ansible.posix.authorized_key:
        user: "{{ item.user }}"
        key: "{{ item.key }}"
        exclusive: true
      loop:
        - { user: "{{ admin_user }}", key: "{{ admin_pubkey }}" }
        - { user: "{{ deploy_user }}", key: "{{ deploy_pubkey }}" }

    - name: NOPASSWD sudo for deploy
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: SSH hardening
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Apply sshd changes now
      ansible.builtin.meta: flush_handlers

    - name: Check that deploy can log in before locking root out
      delegate_to: localhost
      ansible.builtin.command: >
        ssh -o BatchMode=yes -o ConnectTimeout=10 -o ControlPath=none -i ~/.ssh/deploy_ed25519
        {{ deploy_user }}@{{ ansible_host }} sudo -n true
      changed_when: false

    - name: Lock the root password
      ansible.builtin.user:
        name: root
        password_lock: true

  handlers:
    - name: Check full sshd config
      listen: Reload sshd
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Reload ssh service
      listen: Reload sshd
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
